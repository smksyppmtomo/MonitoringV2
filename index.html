<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Data Monitor - Management System</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://iili.io/KjIKMJ9.png" />
    <link rel="apple-touch-icon" href="https://iili.io/KjIKMJ9.png" />

    <!-- PWA Manifest Inline -->
    <link rel="manifest" id="pwa-manifest" />

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Data Monitor" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");

      :root {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      body {
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      .loading-shimmer {
        background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite linear;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .animate-slide-up {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes slideUp {
        from {
          transform: translate(-50%, 100%);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      .custom-scrollbar::-webkit-scrollbar {
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }

      .search-container input:focus + span {
        color: #4f46e5;
      }

      @media (max-width: 640px) {
        .table-container {
          margin: 0 -1rem;
          width: calc(100% + 2rem);
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-900">
    <!-- Header -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex items-center gap-3">
            <img src="https://iili.io/KjIKMJ9.png" alt="Logo" class="w-9 h-9 object-contain rounded-lg" />
            <div class="flex flex-col leading-tight">
              <span class="text-base sm:text-lg font-extrabold bg-gradient-to-r from-indigo-600 to-blue-500 bg-clip-text text-transparent uppercase tracking-tight">DATA MONITOR</span>
              <span class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Attendance System</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button id="installBtn" class="hidden p-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition active:scale-95 flex items-center gap-2 px-3">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span class="text-[10px] font-bold uppercase">Instal</span>
            </button>
            <button id="refreshBtn" class="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition active:scale-90" title="Refresh Data">
              <i data-lucide="refresh-cw" class="w-5 h-5" id="refreshIcon"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-40">
      <!-- Action Bar (Floating) -->
      <div id="bulkActionBar" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-50 w-[95%] max-w-md animate-slide-up">
        <div class="bg-slate-900/95 backdrop-blur shadow-2xl text-white p-3 rounded-2xl flex items-center justify-between border border-white/10">
          <div class="flex items-center gap-3 pl-2">
            <div class="bg-indigo-500 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm" id="selectedCountBadge">0</div>
            <p class="font-bold text-xs">Item Terpilih</p>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="exportBulkExcel()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-[11px] font-bold transition">Excel</button>
            <button onclick="exportBulkPdf()" class="px-3 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-[11px] font-bold transition">PDF</button>
            <button onclick="clearSelection()" class="p-2 text-slate-400 hover:text-white transition"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>

      <!-- Search & Info & Filters -->
      <div class="space-y-4 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-stretch">
          <!-- Search Container -->
          <div class="md:col-span-5 relative group search-container">
            <input
              type="text"
              id="searchInput"
              placeholder="Cari nama atau ID..."
              class="block w-full pl-12 pr-4 py-3.5 border-none rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 transition-all text-sm outline-none placeholder:text-slate-400"
            />
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 transition-colors pointer-events-none">
              <i data-lucide="search" class="w-5 h-5"></i>
            </span>
          </div>

          <!-- Month Filter -->
          <div class="md:col-span-3">
            <select
              id="monthFilter"
              class="block w-full px-4 py-3.5 border-none rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 transition-all text-sm outline-none appearance-none"
            >
              <option value="">Semua Bulan</option>
              <option value="01">Januari</option>
              <option value="02">Februari</option>
              <option value="03">Maret</option>
              <option value="04">April</option>
              <option value="05">Mei</option>
              <option value="06">Juni</option>
              <option value="07">Juli</option>
              <option value="08">Agustus</option>
              <option value="09">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Desember</option>
            </select>
          </div>

          <!-- Date Filter -->
          <div class="md:col-span-2">
            <input
              type="date"
              id="dateFilter"
              class="block w-full px-4 py-3.5 border-none rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 transition-all text-sm outline-none"
            />
          </div>

          <div class="md:col-span-2 bg-white px-5 py-3 rounded-2xl shadow-sm ring-1 ring-slate-200 flex items-center justify-between">
            <div>
              <p id="totalLabel" class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Total Baris</p>
              <h2 id="totalCount" class="text-xl font-extrabold text-slate-900 leading-none">0</h2>
            </div>
            <div class="bg-indigo-50 p-2 rounded-lg text-indigo-600"><i data-lucide="database" class="w-5 h-5"></i></div>
          </div>
        </div>
      </div>

      <!-- Table Container -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden table-container">
        <div id="loadingState" class="p-8 space-y-4">
          <div class="loading-shimmer h-10 w-full rounded-xl"></div>
          <div class="loading-shimmer h-24 w-full rounded-xl"></div>
          <div class="loading-shimmer h-24 w-full rounded-xl"></div>
        </div>

        <div id="emptyState" class="hidden py-20 text-center px-4">
          <div class="bg-slate-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300">
            <i data-lucide="search-x" class="w-8 h-8"></i>
          </div>
          <h3 class="text-base font-bold text-slate-900">Data tidak ditemukan</h3>
          <p id="errorMessage" class="text-slate-500 text-xs mt-1">Gagal memuat data dari Google Sheets.</p>
        </div>

        <div class="overflow-x-auto custom-scrollbar">
          <table id="dataTable" class="min-w-full divide-y divide-slate-100 hidden">
            <thead class="bg-slate-50/50">
              <tr>
                <th class="px-4 py-3 w-10 text-center">
                  <input type="checkbox" id="masterCheckbox" class="w-4 h-4 text-indigo-600 rounded-md border-slate-300 focus:ring-indigo-500" />
                </th>
                <th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">ID</th>
                <th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Nama</th>
                <th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Tanggal</th>
                <th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Waktu</th>
                <th class="px-4 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Status</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="bg-white divide-y divide-slate-100">
              <!-- Data rows injected here -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      // --- PWA CONFIGURATION ---
      const manifest = {
        name: "Data Monitor Attendance",
        short_name: "DataMonitor",
        start_url: ".",
        display: "standalone",
        background_color: "#f8fafc",
        theme_color: "#4f46e5",
        description: "System Monitoring Absensi",
        icons: [
          {
            src: "https://iili.io/KjIKMJ9.png",
            sizes: "192x192",
            type: "image/png",
            purpose: "any maskable",
          },
          {
            src: "https://iili.io/KjIKMJ9.png",
            sizes: "512x512",
            type: "image/png",
          },
        ],
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], { type: "application/json" });
      const manifestURL = URL.createObjectURL(blob);
      document.querySelector("#pwa-manifest").setAttribute("href", manifestURL);

      // Service Worker Inline
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const swCode = `
                    self.addEventListener('install', (e) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    });
                `;
          const swBlob = new Blob([swCode], { type: "application/javascript" });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch((err) => console.log("SW failed", err));
        });
      }

      let deferredPrompt;
      const installBtn = document.getElementById("installBtn");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove("hidden");
      });

      installBtn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === "accepted") {
            installBtn.classList.add("hidden");
          }
          deferredPrompt = null;
        }
      });

      // --- DASHBOARD LOGIC ---
      const SPREADSHEET_ID = "1rOHQHQ_rj-_oM56C1hG5YqwlltWa69xTSz82pKUyJYI";
      const SHEET_NAME = "Attendance";

      const getGvizUrl = () => `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:handleData&sheet=${encodeURIComponent(SHEET_NAME)}&v=${Date.now()}`;

      const DISPLAY_COLUMNS = ["ID", "Nama", "Date", "Time", "Status"];

      let rawData = [];
      let filteredData = [];
      let selectedItems = new Set();
      let isFetching = false;

      const searchInput = document.getElementById("searchInput");
      const monthFilter = document.getElementById("monthFilter");
      const dateFilter = document.getElementById("dateFilter");
      const tableBody = document.getElementById("tableBody");
      const tableEl = document.getElementById("dataTable");
      const loadingState = document.getElementById("loadingState");
      const emptyState = document.getElementById("emptyState");
      const totalCount = document.getElementById("totalCount");
      const bulkActionBar = document.getElementById("bulkActionBar");
      const selectedCountBadge = document.getElementById("selectedCountBadge");
      const errorMessage = document.getElementById("errorMessage");
      const refreshIcon = document.getElementById("refreshIcon");

      function fetchData() {
        if (isFetching) return;
        isFetching = true;
        setLoading(true);
        const oldScript = document.getElementById("gviz-script");
        if (oldScript) oldScript.remove();
        const script = document.createElement("script");
        script.id = "gviz-script";
        script.src = getGvizUrl();
        const fetchTimeout = setTimeout(() => {
          if (isFetching) {
            isFetching = false;
            showError("Waktu permintaan habis. Silakan coba segarkan kembali.");
          }
        }, 10000);
        script.onerror = () => {
          clearTimeout(fetchTimeout);
          isFetching = false;
          showError("Gagal menghubungi Google Sheets. Periksa koneksi internet.");
        };
        document.body.appendChild(script);
      }

      window.handleData = function (response) {
        isFetching = false;
        if (response.status === "error") {
          showError("Google Sheets Error: " + (response.errors[0].detailed_message || "Terjadi kesalahan internal"));
          return;
        }
        const data = response.table;
        const cols = data.cols.map((c) => c.label || "");
        const rows = data.rows.map((r) => {
          const item = {};
          r.c.forEach((cell, idx) => {
            const colName = cols[idx] || `Column_${idx}`;
            item[colName] = cell ? cell.f || cell.v || "" : "";
          });
          return item;
        });
        if (rows.length > 0) processProcessedData(rows);
        else showError("Data tidak ditemukan atau sheet kosong.");
      };

      function showError(msg) {
        setLoading(false);
        tableEl.classList.add("hidden");
        emptyState.classList.remove("hidden");
        errorMessage.textContent = msg;
      }

      function processProcessedData(data) {
        rawData = data.filter((row) => {
          for (let key in row) if (row[key] !== "") return true;
          return false;
        });
        applyFilters();
        setLoading(false);
      }

      function setLoading(isLoading) {
        if (isLoading) {
          loadingState.classList.remove("hidden");
          tableEl.classList.add("hidden");
          emptyState.classList.add("hidden");
          refreshIcon.classList.add("animate-spin");
        } else {
          loadingState.classList.add("hidden");
          refreshIcon.classList.remove("animate-spin");
        }
      }

      function getColumnValue(row, colName) {
        const keys = Object.keys(row);
        const target = colName.toLowerCase().trim();
        let match = keys.find((k) => k.toLowerCase().trim() === target);
        if (!match) {
          if (target === "nama") match = keys.find((k) => k.toLowerCase().includes("nama") || k.toLowerCase() === "name");
          if (target === "id") match = keys.find((k) => k.toLowerCase() === "id" || k.toLowerCase().includes("nik"));
          if (target === "date") match = keys.find((k) => k.toLowerCase().includes("date") || k.toLowerCase().includes("tanggal"));
          if (target === "time") match = keys.find((k) => k.toLowerCase().includes("time") || k.toLowerCase().includes("jam"));
          if (target === "status") match = keys.find((k) => k.toLowerCase().includes("status"));
        }
        return match ? row[match] : "-";
      }

      function applyFilters() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const monthTerm = monthFilter.value;
        const dateTerm = dateFilter.value;

        filteredData = rawData.filter((row) => {
          const matchesSearch = searchTerm === "" || Object.values(row).some((val) => String(val).toLowerCase().includes(searchTerm));
          const rowDateValue = getColumnValue(row, "Date");
          let rowMonth = "";
          let rowFullDate = "";

          if (rowDateValue && rowDateValue !== "-") {
            const parts = rowDateValue.split(/[\/\-]/);
            if (parts.length === 3) {
              if (parts[2].length === 4) {
                rowMonth = parts[1].padStart(2, "0");
                rowFullDate = `${parts[2]}-${parts[1].padStart(2, "0")}-${parts[0].padStart(2, "0")}`;
              } else if (parts[0].length === 4) {
                rowMonth = parts[1].padStart(2, "0");
                rowFullDate = `${parts[0]}-${parts[1].padStart(2, "0")}-${parts[2].padStart(2, "0")}`;
              }
            }
          }

          const matchesMonth = monthTerm === "" || rowMonth === monthTerm;
          const matchesDate = dateTerm === "" || rowFullDate === dateTerm;

          return matchesSearch && matchesMonth && matchesDate;
        });
        renderTable();
      }

      function renderTable() {
        totalCount.textContent = filteredData.length;
        if (filteredData.length === 0) {
          tableEl.classList.add("hidden");
          emptyState.classList.remove("hidden");
          return;
        }
        tableEl.classList.remove("hidden");
        emptyState.classList.add("hidden");
        const fragment = document.createDocumentFragment();
        filteredData.forEach((row) => {
          const rowStr = JSON.stringify(row);
          const isSelected = Array.from(selectedItems).some((item) => JSON.stringify(item) === rowStr);
          const tr = document.createElement("tr");
          tr.className = `group transition-colors cursor-pointer ${isSelected ? "bg-indigo-50/70" : "hover:bg-slate-50"}`;
          let rowHtml = `
                    <td class="px-4 py-3 text-center">
                        <input type="checkbox" class="row-checkbox w-4 h-4 text-indigo-600 rounded-md border-slate-300 pointer-events-none" ${isSelected ? "checked" : ""}>
                    </td>`;
          DISPLAY_COLUMNS.forEach((col) => {
            const value = getColumnValue(row, col);
            let content = value;
            let cellStyle = "text-slate-600 font-medium";
            if (col === "Status") {
              const v = String(value).toLowerCase();
              if (v.includes("masuk")) content = `<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[9px] font-extrabold uppercase tracking-tighter">MASUK</span>`;
              else if (v.includes("pulang")) content = `<span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 text-[9px] font-extrabold uppercase tracking-tighter">PULANG</span>`;
              else content = `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[9px] font-extrabold uppercase tracking-tighter">${value}</span>`;
            } else if (col === "Nama") cellStyle = "text-slate-900 font-bold tracking-tight";
            rowHtml += `<td class="px-4 py-3 whitespace-nowrap text-xs sm:text-sm ${cellStyle}">${content}</td>`;
          });
          tr.innerHTML = rowHtml;
          tr.onclick = () => {
            const cb = tr.querySelector(".row-checkbox");
            const newState = !cb.checked;
            cb.checked = newState;
            toggleItemSelection(row, newState);
            updateBulkUI();
            tr.className = `group transition-colors cursor-pointer ${newState ? "bg-indigo-50/70" : "hover:bg-slate-50"}`;
          };
          fragment.appendChild(tr);
        });
        tableBody.innerHTML = "";
        tableBody.appendChild(fragment);
        const masterCb = document.getElementById("masterCheckbox");
        masterCb.checked = filteredData.length > 0 && filteredData.every((row) => Array.from(selectedItems).some((item) => JSON.stringify(item) === JSON.stringify(row)));
        masterCb.onchange = (e) => {
          filteredData.forEach((row) => toggleItemSelection(row, e.target.checked));
          renderTable();
        };
        updateBulkUI();
        if (window.lucide) lucide.createIcons();
      }

      function toggleItemSelection(row, isChecked) {
        const rowStr = JSON.stringify(row);
        if (isChecked) {
          let exists = false;
          selectedItems.forEach((item) => {
            if (JSON.stringify(item) === rowStr) exists = true;
          });
          if (!exists) selectedItems.add(row);
        } else {
          let itemToDelete = null;
          selectedItems.forEach((item) => {
            if (JSON.stringify(item) === rowStr) itemToDelete = item;
          });
          if (itemToDelete) selectedItems.delete(itemToDelete);
        }
      }

      function updateBulkUI() {
        selectedCountBadge.textContent = selectedItems.size;
        bulkActionBar.classList.toggle("hidden", selectedItems.size === 0);
      }

      function clearSelection() {
        selectedItems.clear();
        renderTable();
      }

      let searchTimeout;
      searchInput.addEventListener("input", () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(applyFilters, 300);
      });

      monthFilter.addEventListener("change", applyFilters);
      dateFilter.addEventListener("change", applyFilters);

      function getMappedExportData() {
        return Array.from(selectedItems).map((row, index) => {
          const mapped = {};
          mapped["No"] = index + 1;
          DISPLAY_COLUMNS.forEach((col) => {
            if (col === "ID") return;
            const label = col === "Date" ? "Tanggal" : col === "Time" ? "Waktu" : col;
            mapped[label] = getColumnValue(row, col);
          });
          return mapped;
        });
      }

      function getDynamicFileName(extension) {
        let nameForFile = "";
        const items = Array.from(selectedItems);
        const term = searchInput.value.trim();
        if (term && filteredData.length > 0) {
          nameForFile = getColumnValue(filteredData[0], "Nama");
        } else if (items.length > 0) {
          nameForFile = getColumnValue(items[0], "Nama");
        }
        const dateStr = new Date().toLocaleDateString("id-ID").replace(/\//g, "-");
        const baseName = nameForFile ? `Laporan_Absensi_${nameForFile.replace(/\s+/g, "_")}_${dateStr}` : `Laporan_Absensi_Bulanan_${dateStr}`;
        return `${baseName}.${extension}`;
      }

      window.exportBulkExcel = () => {
        const data = getMappedExportData();
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data Absensi");
        XLSX.writeFile(wb, getDynamicFileName("xlsx"));
      };

      window.exportBulkPdf = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("p", "mm", "a4");
        const data = getMappedExportData();
        if (data.length === 0) return;
        const headers = [Object.keys(data[0])];
        const rows = data.map((r) => Object.values(r));
        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.text("LAPORAN ABSENSI BULANAN GURU/STAFF", 105, 15, { align: "center" });
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(`Dicetak pada: ${new Date().toLocaleString("id-ID")}`, 14, 22);
        doc.autoTable({
          head: headers,
          body: rows,
          startY: 25,
          theme: "striped",
          headStyles: { fillColor: [79, 70, 229] },
          styles: { fontSize: 9, cellPadding: 3 },
        });
        doc.save(getDynamicFileName("pdf"));
      };

      document.getElementById("refreshBtn").onclick = fetchData;
      window.addEventListener("DOMContentLoaded", fetchData);
    </script>
  </body>
</html>
